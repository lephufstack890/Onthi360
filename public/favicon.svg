<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Ôn Thi 360</title>
  <desc id="desc">Biểu tượng vòng cung xanh và mũi tên vàng của Ôn Thi 360</desc>
  <defs>
    <linearGradient id="ring" x1="15" y1="9" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0757E8"/>
      <stop offset=".58" stop-color="#1479F2"/>
      <stop offset="1" stop-color="#33C8EF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="13" y1="53" x2="55" y2="9" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB000"/>
      <stop offset="1" stop-color="#FFD21A"/>
    </linearGradient>
  </defs>
  <!-- Vòng tròn xanh khép kín, liền nét -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ring)" stroke-width="11"/>
  <!-- Thân mũi tên được ngắt ở tâm để đọc rõ là mũi tên, không phải kim đồng hồ -->
  <path d="M11 53 25 39M35 29 47 17" fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-width="8"/>
  <!-- Đầu mũi tên theo đúng hình biểu tượng gốc -->
  <path d="m39 13 19-7-5 19-6-6-8 8-6-6 8-8Z" fill="url(#arrow)"/>
</svg>
