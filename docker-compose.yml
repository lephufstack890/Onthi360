# Môi trường dev cục bộ đồng bộ giữa các máy — theo lựa chọn "Docker" ở câu hỏi
# trước. Không phải Laravel Sail (tránh thêm composer dependency chưa verify
# được trong lúc dựng base này) nhưng tương đương: PHP-FPM + Nginx + MySQL +
# Redis + Mailpit. Chạy: docker compose up -d
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on: [mysql, redis]
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - .:/var/www/html
    depends_on: [mysql, redis]
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: onthi360
      MYSQL_USER: onthi360
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

volumes:
  mysql_data:
