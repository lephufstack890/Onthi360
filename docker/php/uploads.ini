; ══════ Giới hạn tải tệp của PHP ══════
;
; SỬA 15/9 — trước để 10M/12M, đặt từ hồi tệp lớn nhất chỉ là ảnh bìa sản phẩm 4MB.
; Từ đó ứng dụng đã nhận những tệp lớn hơn nhiều, nên mọi lần tải tài liệu nặng đều
; bị chặn trước khi tới được PHP (nginx trả 413 Request Entity Too Large).
;
; ── Giới hạn THẬT của ứng dụng (tính bằng KB, xem mã nguồn) ──
;   PdfBulkImportService::MAX_SOURCE_PDF_KB        204800  = 200MB  <- lớn nhất
;   PdfAssessmentEditingService::MAX_PDF_KB         51200  =  50MB
;   ProductController::MAX_MEDIA_KB                 51200  =  50MB
;   ContentService::MAX_BULK_MATERIAL_ZIP_KB        51200  =  50MB
;   ContentService::MAX_MATERIAL_AUDIO_KB           20480  =  20MB
;   ContentService::MAX_MATERIAL_IMAGE_KB           15360  =  15MB
;
; ── Vì sao đặt CAO HƠN giới hạn của ứng dụng ──
; Ba tầng chặn phải xếp theo thứ tự: nginx > post_max_size > upload_max_filesize > luật
; kiểm tra của Laravel. Nhờ vậy tệp quá khổ bị CHÍNH LARAVEL từ chối và người dùng đọc
; được câu tiếng Việt "Tệp tối đa ...MB". Nếu đặt bằng hoặc thấp hơn, PHP vứt luôn cả
; thân yêu cầu trước khi Laravel chạy — mất cả mã CSRF — và người dùng nhận một trang
; 419 "Page expired" hoặc 413 trần trụi, không hiểu vì sao.
upload_max_filesize = 210M
post_max_size = 220M

; Tải 200MB qua đường truyền chậm mất nhiều phút; mặc định 60 giây là đứt giữa chừng.
max_input_time = 600
max_execution_time = 600

; Laravel ghi tệp tải lên thẳng ra đĩa nên không tốn RAM theo dung lượng tệp, nhưng khâu
; đọc và cắt PDF nhập hàng loạt thì có.
memory_limit = 512M

; Màn "nhập nhiều PDF một lúc" cho chọn nhiều tệp trong một lần gửi.
max_file_uploads = 50
