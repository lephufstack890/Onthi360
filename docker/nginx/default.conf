server {
    listen 80;
    index index.php;
    root /var/www/html/public;

    # Khớp với upload_max_filesize/post_max_size ở docker/php/uploads.ini —
    # nginx mặc định chỉ 1MB, nhỏ hơn ảnh bìa sản phẩm thực tế nên sẽ chặn
    # trước khi tới được PHP (413) nếu không tăng ở đây.
    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
