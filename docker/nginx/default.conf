server {
    listen 80;
    index index.php;
    root /var/www/html/public;

    # ══════ Giới hạn dung lượng yêu cầu ══════
    # nginx mặc định chỉ cho 1MB và trả 413 Request Entity Too Large trước khi yêu cầu
    # tới được PHP, nên con số này PHẢI lớn hơn post_max_size ở docker/php/uploads.ini
    # (220M). Đặt bằng hoặc nhỏ hơn thì nginx chặn trước, người dùng chỉ thấy trang 413
    # trần trụi thay vì câu báo lỗi tiếng Việt của Laravel.
    # Tệp lớn nhất ứng dụng nhận là PDF nguồn nhập hàng loạt 200MB
    # (PdfBulkImportService::MAX_SOURCE_PDF_KB).
    client_max_body_size 230M;

    # Tải 200MB qua đường truyền chậm mất nhiều phút — mặc định 60 giây sẽ đứt giữa chừng.
    client_body_timeout 600s;
    send_timeout 600s;

    # ══════ SỬA 30/9 (3) — nén và cho trình duyệt giữ lại tệp tĩnh ══════
    # Khách kêu "bấm qua trang lộ trình ảnh tải chậm". Hai nguyên nhân ở tầng máy chủ:
    #   · KHÔNG bật gzip  -> tệp app-*.css nặng 219KB gửi nguyên xi, gzip xong còn ~30KB;
    #   · KHÔNG đặt hạn dùng -> mỗi lần chuyển trang trình duyệt lại hỏi lại từng tấm ảnh,
    #     chục tấm là chục lượt đi về, đường truyền yếu là thấy giật.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # Tệp do vite sinh có mã băm trong tên (app-BHdXR6Bc.css) — đổi nội dung là đổi tên,
    # nên giữ được cả năm mà không sợ người dùng kẹt bản cũ.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ảnh và phông chữ: giữ 30 ngày. Ảnh nào cần thay gấp thì đổi tên tệp là xong.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Cắt/đọc PDF hàng trăm trang chạy lâu hơn mặc định 60 giây của nginx.
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
